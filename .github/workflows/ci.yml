name: Validate application
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicalstore
          # Isolated test-only service; not used by the Windows/local Compose stack.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: medicalstore_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medicalstore -d medicalstore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://medicalstore@127.0.0.1:5432/medicalstore_test?schema=public
      TEST_DATABASE_URL: postgresql://medicalstore@127.0.0.1:5432/medicalstore_test?schema=public
      ENABLE_BACKUPS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
